openapi: 3.0.3
info:
  title: ModularHub User Management API
  version: 0.0.1
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: [ ]
tags:
  - name: User
paths:
  /users:
    get:
      tags:
        - User
      operationId: getAllUsers
      x-spring-paginated: true
      parameters:
        - name: text
          in: query
          required: false
          description: Free text searched in first name, last name and email
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/Page'
        - $ref: 'common.yaml#/components/parameters/Size'
        - $ref: 'common.yaml#/components/parameters/Sort'
      responses:
        '200':
          description: Page of users
          headers:
            X-Total-Count:
              $ref: 'common.yaml#/components/headers/TotalCount'
            X-Total-Pages:
              $ref: 'common.yaml#/components/headers/TotalPages'
            X-Current-Page:
              $ref: 'common.yaml#/components/headers/CurrentPage'
            X-Page-Size:
              $ref: 'common.yaml#/components/headers/PageSize'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerError'
    post:
      tags:
        - User
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerError'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /users/{uuid}:
    parameters:
      - $ref: '#/components/parameters/UserUuid'
    get:
      tags:
        - User
      operationId: getUserByUuid
      responses:
        '200':
          description: User with audit and groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerError'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
    put:
      tags:
        - User
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerError'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - User
      operationId: deleteUserByUuid
      responses:
        '204':
          description: User deleted
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerError'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /users/{uuid}/reset-password:
    parameters:
      - $ref: '#/components/parameters/UserUuid'
    post:
      tags:
        - User
      operationId: resetPassword
      responses:
        '204':
          description: Reset password email sent
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerError'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      $ref: 'common.yaml#/components/securitySchemes/bearerAuth'
  parameters:
    UserUuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    UserCreateRequest:
      type: object
      required:
        - firstname
        - lastname
        - gender
        - languageId
        - taxIdNumber
        - email
        - username
        - password
        - enabled
      properties:
        firstname:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        lastname:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        gender:
          $ref: 'core.yaml#/components/schemas/Gender'
        languageId:
          type: string
          format: uuid
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        mobileNumber:
          type: string
        taxIdNumber:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        email:
          type: string
          format: email
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        username:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        password:
          type: string
          format: password
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        enabled:
          type: boolean
    UserUpdateRequest:
      type: object
      required:
        - firstname
        - lastname
        - gender
        - languageId
        - taxIdNumber
        - email
        - username
        - enabled
      properties:
        firstname:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        lastname:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        gender:
          $ref: 'core.yaml#/components/schemas/Gender'
        languageId:
          type: string
          format: uuid
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        mobileNumber:
          type: string
        taxIdNumber:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        email:
          type: string
          format: email
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        username:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        enabled:
          type: boolean
    UserResponse:
      type: object
      required:
        - id
        - firstname
        - lastname
        - gender
        - taxIdNumber
        - email
        - username
        - enabled
        - groups
      properties:
        id:
          type: string
          format: uuid
        firstname:
          type: string
        lastname:
          type: string
        gender:
          $ref: 'core.yaml#/components/schemas/Gender'
        language:
          $ref: 'core.yaml#/components/schemas/LanguageResponse'
        mobileNumber:
          type: string
        taxIdNumber:
          type: string
        email:
          type: string
        username:
          type: string
        enabled:
          type: boolean
        groups:
          type: array
          uniqueItems: true
          items:
            $ref: 'core.yaml#/components/schemas/IdentityGroup'
        audit:
          $ref: 'core.yaml#/components/schemas/Audit'
