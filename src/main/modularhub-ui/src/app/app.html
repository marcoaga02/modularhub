<p-toast position="top-right" [pt]="toastPT">
  <ng-template #message let-msg>
    @if (msg.severity === 'error') {
      <div class="flex items-start gap-3 p-2">
        <i class="pi pi-times-circle mt-0.5"></i>
        <div class="flex flex-col gap-2">
          <span class="font-bold">{{ msg.summary | translate }}</span>
          <span class="text-sm">{{ msg.detail | translate: (msg.data?.fields ? { fields: msg.data.fields } : {}) }}</span>
        </div>
      </div>
    } @else {
      <div class="flex items-start gap-3 p-2">
        <i class="pi" [ngClass]="{
          'pi-check-circle': msg.severity === 'success',
          'pi-info-circle': msg.severity === 'info',
          'pi-exclamation-triangle': msg.severity === 'warn'
        }"></i>
        <div class="flex flex-col gap-2">
          @if (msg.summary) {
            <span class="font-bold">{{ msg.summary }}</span>
          }
          <span class="text-sm">{{ msg.detail | translate }}</span>
        </div>
      </div>
    }
  </ng-template>
</p-toast>
<p-confirm-dialog/>
<div class="flex h-screen">
  <app-sidebar />
  <div class="flex min-w-0 flex-1 flex-col bg-ground">
    <app-topbar />
    <main class="min-h-0 flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
