<p-toast position="top-right" [pt]="toastPT">
  <ng-template #message let-msg>
    @if (msg.severity === 'error') {
      <div class="flex items-start gap-3 p-2">
        <i class="pi pi-times-circle text-red-500 mt-0.5"></i>
        <div class="flex flex-col gap-2">
          <span class="font-bold">{{ msg.summary | translate }}</span>
          <span class="text-sm">{{ msg.detail | translate: (msg.data?.fields ? { fields: msg.data.fields } : {}) }}</span>
        </div>
      </div>
    } @else {
      <div class="flex items-start gap-3 p-2">
        <i class="pi" [ngClass]="{
          'pi-check-circle text-green-500': msg.severity === 'success',
          'pi-info-circle text-blue-500': msg.severity === 'info',
          'pi-exclamation-triangle text-yellow-500': msg.severity === 'warn'
        }"></i>
        <div class="flex flex-col gap-2">
          @if (msg.summary) {
            <span class="font-bold">{{ msg.summary }}</span>
          }
          <span class="text-sm">{{ msg.detail }}</span>
        </div>
      </div>
    }
  </ng-template>
</p-toast>
<p-confirm-dialog/>
<div class="flex flex-col h-screen">
  <app-topbar />
  <div class="flex flex-1 overflow-hidden">
    <app-sidebar class="py-1"/>
    <main class="flex-1 min-w-0 overflow-auto p-4">
      <router-outlet />
    </main>
  </div>
</div>
