<nav
  class="flex h-full flex-col border-r bg-content transition-[width] duration-300"
  [class.w-64]="isOpen()"
  [class.w-16]="!isOpen()"
>
  <div class="flex h-14 shrink-0 items-center gap-3 border-b px-4">
    <img src="/logo.svg" class="size-8 shrink-0" alt="" />
    @if (isOpen()) {
      <span class="truncate font-semibold">ModularHub</span>
    }
  </div>

  <ul class="flex min-h-0 flex-1 flex-col gap-1 overflow-y-auto p-2">
    @for (plugin of plugins(); track plugin.path) {
      <li>
        <a
          [routerLink]="['/', plugin.path]"
          routerLinkActive="bg-highlight text-on-highlight"
          #link="routerLinkActive"
          class="flex h-10 items-center gap-3 rounded-lg px-3 hover:bg-content-hover"
          [class.justify-center]="!isOpen()"
          [pTooltip]="isOpen() ? '' : (plugin.description | translate)"
          tooltipPosition="right"
        >
          <i class="shrink-0 text-lg" [class]="plugin.icon"></i>
          @if (isOpen()) {
            <span class="flex-1 truncate text-sm">{{ plugin.description | translate }}</span>
            @if (link.isActive) {
              <span class="size-1.5 shrink-0 rounded-full bg-accent"></span>
            }
          }
        </a>
      </li>
    }
  </ul>

  <div class="flex flex-col gap-1 border-t p-2">
    <button
      type="button"
      class="flex h-10 items-center gap-3 rounded-lg px-3 text-muted hover:bg-content-hover"
      [class.justify-center]="!isOpen()"
      [pTooltip]="isOpen() ? '' : ('core.components.sidebar.expand' | translate)"
      tooltipPosition="right"
      (click)="toggle()"
    >
      <i
        class="pi shrink-0 text-lg"
        [class.pi-angle-double-left]="isOpen()"
        [class.pi-angle-double-right]="!isOpen()"
      ></i>
      @if (isOpen()) {
        <span class="truncate text-sm">{{ 'core.components.sidebar.collapse' | translate }}</span>
      }
    </button>
    <button
      type="button"
      class="flex h-10 items-center gap-3 rounded-lg px-3 text-muted hover:bg-content-hover hover:text-danger"
      [class.justify-center]="!isOpen()"
      [pTooltip]="isOpen() ? '' : ('general.logout.label' | translate)"
      tooltipPosition="right"
      (click)="logout()"
    >
      <i class="pi pi-sign-out shrink-0 text-lg"></i>
      @if (isOpen()) {
        <span class="truncate text-sm">{{ 'general.logout.label' | translate }}</span>
      }
    </button>
  </div>
</nav>
