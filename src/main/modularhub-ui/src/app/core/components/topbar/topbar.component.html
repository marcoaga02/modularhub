<p-toolbar class="h-14 shrink-0 border-x-0 border-t-0">
  <ng-template #start>
    @if (currentPlugin(); as plugin) {
      <div class="flex min-w-0 items-center gap-2">
        <i class="text-lg text-primary" [class]="plugin.icon"></i>
        <span class="truncate text-lg font-semibold">{{ plugin.description | translate }}</span>
      </div>
    }
  </ng-template>
  <ng-template #end>
    @if (account(); as account) {
      <p-avatar
        [label]="initials()"
        shape="circle"
        [pt]="avatarPT"
        size="normal"
        (click)="op.toggle($event)"
      />
      <p-popover #op [pt]="popoverPT" appendTo="self">
        <div class="flex w-64 flex-col">
          <div class="flex min-w-0 flex-col p-4">
            <span class="truncate font-semibold">{{ fullName() }}</span>
            <span class="truncate text-sm text-muted">{{ account.email }}</span>
          </div>
          <div class="border-t p-2">
            <button
              type="button"
              class="flex h-10 w-full items-center gap-3 rounded-lg px-3 text-sm hover:bg-content-hover"
              (click)="op.hide(); onProfileClick()"
            >
              <i class="pi pi-user"></i>
              {{ 'core.components.top-bar.profile' | translate }}
            </button>
          </div>
          <div class="border-t p-2">
            <button
              type="button"
              class="flex h-10 w-full items-center gap-3 rounded-lg px-3 text-sm hover:bg-content-hover hover:text-danger"
              (click)="op.hide(); logout()"
            >
              <i class="pi pi-sign-out"></i>
              {{ 'general.logout.label' | translate }}
            </button>
          </div>
        </div>
      </p-popover>
    }
  </ng-template>
</p-toolbar>
