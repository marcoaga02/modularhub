<p-toolbar class="h-14 shrink-0 border-x-0 border-t-0">
  <ng-template #start>
    @if (currentPlugin(); as plugin) {
      <div class="flex min-w-0 items-center gap-2">
        <i class="text-lg text-primary" [class]="plugin.icon"></i>
        <span class="truncate text-lg font-semibold">{{ plugin.description | translate }}</span>
      </div>
    }
  </ng-template>
  <ng-template #end>
    @if (account(); as account) {
      <p-avatar
        [label]="initials()"
        shape="circle"
        [pt]="avatarPT"
        size="normal"
        (click)="op.toggle($event)"
      />
      <p-popover #op [pt]="popoverPT" appendTo="self">
        <div class="flex flex-col">
          <div class="flex items-center gap-3 p-3">
            <p-avatar [label]="initials()" shape="circle" [pt]="avatarPT" size="large" />
            <div class="flex flex-col min-w-0">
              <span class="font-bold truncate">{{ fullName() }}</span>
              <span class="text-sm text-muted truncate">{{ account.username }}</span>
            </div>
          </div>
          <hr />
          <div
            class="flex items-center gap-3 px-3 py-3.5 cursor-pointer hover:bg-content-hover rounded-lg"
            (click)="onProfileClick()"
          >
            <i class="pi pi-user text-muted"></i>
            <span class="text-sm">{{ 'core.components.top-bar.profile' | translate }}</span>
          </div>
          <hr />
          <div
            class="flex items-center gap-3 px-3 py-3.5 cursor-pointer hover:bg-content-hover rounded-lg text-danger"
            (click)="logout()"
          >
            <i class="pi pi-sign-out"></i>
            <span class="text-sm">{{ 'general.logout.label' | translate }}</span>
          </div>
        </div>
      </p-popover>
    }
  </ng-template>
</p-toolbar>
