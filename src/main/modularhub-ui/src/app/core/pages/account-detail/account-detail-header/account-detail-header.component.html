@if(!loading() && currentAccount) {
  <div class="flex align-items-center justify-content-between w-full">
    <div class="flex gap-3 items-center">
      <p-avatar
        [label]="getInitials()"
        shape="circle"
        size="large"
        class="shrink-0"
        [pt]="avatarPT"
      />
      <div class="flex flex-col min-w-0">
        <span class="text-xl truncate">{{ getFullName() }}</span>
        <span class="truncate text-gray-500">{{ currentAccount.username }}</span>
      </div>
    </div>
  </div>
}
