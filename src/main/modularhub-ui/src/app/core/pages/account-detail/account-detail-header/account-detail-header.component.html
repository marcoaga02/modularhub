@if (account(); as account) {
  <div class="flex align-items-center justify-content-between w-full">
    <div class="flex gap-3 items-center">
      <p-avatar [label]="initials()" shape="circle" size="large" class="shrink-0" [pt]="avatarPT" />
      <div class="flex flex-col min-w-0">
        <span class="text-xl truncate">{{ fullName() }}</span>
        <span class="truncate text-gray-500">{{ account.username }}</span>
      </div>
    </div>
  </div>
}
